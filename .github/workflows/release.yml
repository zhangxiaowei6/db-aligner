name: Windows Release 草稿
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            .tools/npm-cache
            .tools/m2
          key: windows-dependencies-${{ hashFiles('package-lock.json', 'engine/pom.xml') }}
      - run: npm ci
      - run: npm run release:check
      - run: npm run bootstrap
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: MySQL 与 PostgreSQL 完整预览交互
        run: npm run qa:ui -w desktop -- --multi-database
      - name: 两种数据库隔离真库与打包客户端验收
        run: |
          ./scripts/mysql-test-server.ps1 -Version 5.7.44 -Port 33957
          ./scripts/mysql-test-server.ps1 -Version 8.0.45 -Port 33980
          ./scripts/mysql-test-server.ps1 -Version 8.4.8 -Port 33984
          ./scripts/postgresql-test-server.ps1 -Port 33917
          ./scripts/mvn.ps1 test '-Ddbaligner.mysql.versions=5.7.44,8.0.45,8.4.8' '-Ddbaligner.postgresql.test=true' '-Ddbaligner.electron.smoke=true'
          if ($LASTEXITCODE -ne 0) { throw '隔离真库或打包客户端验收失败' }
      - name: 停止项目 MySQL 隔离实例
        if: always()
        run: ./scripts/mysql-test-stop.ps1
      - name: 停止项目 PostgreSQL 隔离实例
        if: always()
        run: ./scripts/postgresql-test-stop.ps1
      - run: npm run release:files
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 14
          path: |
            release/DBAligner-Setup-*.exe
            release/DBAligner-Setup-*.exe.blockmap
            release/latest.yml
            release/DBAligner-*-win-x64.zip
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            docs/multi-database-ui-qa.json
            docs/native-smoke-result.json
            docs/postgresql-native-smoke.json
            docs/postgresql-native-cached-smoke.json
            docs/screenshots/react-ant-design/multi-db-*.png
  draft:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: 创建或更新草稿，禁止覆盖公开版本
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish-draft.ps1
